---
name: integration test
on:
  workflow_call:

jobs:
  integration-test:
    # Go modules are downloaded by the gomodule job in the caller workflow
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go modules
        uses: suzuki-shunsuke/download-go-module-action/restore@v0.0.10

      - run: go install ./cmd/mkghtag
      - run: mkghtag --version
